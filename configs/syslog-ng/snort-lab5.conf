# Lab 5 - Snort Alert Collection
# Collects Snort alerts using syslog-ng and stores them in a dedicated Lab 5 log file.

source s_snort_lab5{
    file(
        "/var/log/snort/snort.alert.fast"
        follow-freq(1)
        flags(no-parse)
    );
};

destination d_snort_lab5{
    file(
        "/var/log/lab5/snort-collected.log"
        create-dirs(yes)
    );
};

log{
    source(s_snort_lab5);
    destination(d_snort_lab5);
};
